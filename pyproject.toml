[project]
name = "pos"
dynamic = ["version"]
description = "Prologix OpenGPIB Scanner and GPIB enumerator."
readme = "README.md"
authors = [{ name = "Auto-generated" }]
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5"
]

[project.urls]
"Homepage" = "https://example.com"

[project.scripts]
pos = "pos:main"

[tool.setuptools]
py-modules = ["pos"]

[tool.setuptools.dynamic]
version = { attr = "pos.__version__" }

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
