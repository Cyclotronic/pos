name: Build Cross-Platform Binaries
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-x86_64
          - os: windows-latest
            artifact: windows-x86_64
          - os: macos-15
            artifact: macos-x86_64
          - os: macos-14
            artifact: macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyserial pyinstaller

      - name: Build macOS Binary
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onefile --windowed --name pos pos.py
          cd dist
          zip -qry "../pos-${{ matrix.artifact }}.zip" pos.app pos
          cd ..

      - name: Build Linux Binary
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --name pos pos.py
          tar -C dist -czf "pos-${{ matrix.artifact }}.tar.gz" pos

      - name: Build Windows Binary
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --windowed --name pos pos.py
          Compress-Archive -Path dist\pos.exe -DestinationPath "pos-${{ matrix.artifact }}.zip"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: binary-${{ matrix.artifact }}
          path: |
            *.zip
            *.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4.1.9
        with:
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: artifacts/**/*